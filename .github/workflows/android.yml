name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu runners come with the Android SDK preinstalled (ANDROID_HOME)

      - name: Install
        run: npm ci

      - name: Build game and sync into Android project
        run: node build.js && npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Meowzle-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Meowzle-APK
          path: Meowzle-build-*.apk

      - name: Publish as a download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Meowzle test build ${{ github.run_number }}
          body: Test build (debug-signed) for installing on your phone. Not for Play Store upload.
          prerelease: true
          files: Meowzle-build-*.apk
